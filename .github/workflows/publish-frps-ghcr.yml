name: Publish frps to GHCR

on:
  push:
    branches:
      - dev_multi

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-frps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frps (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${OWNER}/frps" >> "${GITHUB_OUTPUT}"

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frps
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=frps
            org.opencontainers.image.description=Custom frps server image from CiBeDer/frp

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/frps"
          SHA_TAG="${IMAGE}:${GITHUB_SHA}"

          if [ "${GITHUB_REF_NAME}" = "dev_multi" ]; then
            MOVING_TAG="${IMAGE}:dev_multi-latest"
          else
            MOVING_TAG="${IMAGE}:candidate-latest"
          fi

          docker buildx imagetools create \
            -t "${SHA_TAG}" \
            -t "${MOVING_TAG}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

          docker buildx imagetools inspect "${SHA_TAG}"
